name: CI/CD - Build, Scan, Gate, Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_REPOSITORY: ${{ github.repository }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize image name to lowercase
        run: |
          echo "IMAGE_NAME=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_REPOSITORY }}/devsecops-demo' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build image (not pushed yet — scan first)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Save image as artifact for the scan job
        run: docker save ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -o image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: image-tar
          path: image.tar
          retention-days: 1

  security-gate:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: image-tar

      - name: Load image
        run: docker load -i image.tar

      - name: Normalize image name to lowercase
        run: |
          echo "IMAGE_NAME=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_REPOSITORY }}/devsecops-demo' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # --- HARD GATE #1: container vulnerability scan ---
      - name: Trivy vulnerability scan (blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy scan (full report, non-blocking, for visibility)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"

      - name: Upload scan results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      # --- HARD GATE #2: static secret scan ---
      - name: Scan for committed secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  push-image:
    needs: security-gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Normalize image name to lowercase
        run: |
          echo "IMAGE_NAME=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_REPOSITORY }}/devsecops-demo' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: image-tar

      - name: Load scanned image
        run: docker load -i image.tar

      - name: Tag and push scanned image to GHCR
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.IMAGE_NAME }}:latest

  update-manifest:
    needs: push-image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Check for MANIFEST_REPO_PAT
        id: check_pat
        run: |
          if [ -z "${{ secrets.MANIFEST_REPO_PAT }}" ]; then
            echo "::warning::MANIFEST_REPO_PAT secret is not set. Skipping external manifest update."
            echo "has_pat=false" >> $GITHUB_OUTPUT
          else
            echo "has_pat=true" >> $GITHUB_OUTPUT
          fi

      - name: Normalize image name to lowercase
        run: |
          echo "IMAGE_NAME=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_REPOSITORY }}/devsecops-demo' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Checkout manifests repository
        if: steps.check_pat.outputs.has_pat == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/gitops-devsecops-manifests
          token: ${{ secrets.MANIFEST_REPO_PAT }}
          path: manifests

      - name: Update image tag via Kustomize (GitOps write step)
        if: steps.check_pat.outputs.has_pat == 'true'
        run: |
          cd manifests/overlays/dev
          kustomize edit set image ${{ env.IMAGE_NAME }}=${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Commit and push manifest update
        if: steps.check_pat.outputs.has_pat == 'true'
        run: |
          cd manifests
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add .
          git commit -m "deploy: dev -> ${{ env.IMAGE_TAG }}" || echo "no changes"
          git push
