apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-non-root-and-drop-capabilities
  annotations:
    policies.kyverno.io/title: Require Non-Root and Dropped Capabilities
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Real-world problem: a container running as root or with default Linux
      capabilities gives an attacker who breaks out of the app process a much
      easier path to host/cluster compromise. This enforces the pattern used
      in the Dockerfile (non-root USER + capabilities dropped) at admission time,
      so a workload built without that hardening is rejected before it runs.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-runAsNonRoot
      match:
        any:
          - resources:
              kinds: ["Pod"]
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
                - argocd
                - local-path-storage
      validate:
        message: "Containers must set securityContext.runAsNonRoot: true."
        pattern:
          spec:
            =(securityContext):
              runAsNonRoot: true
            containers:
              - securityContext:
                  runAsNonRoot: true

    - name: check-drop-capabilities
      match:
        any:
          - resources:
              kinds: ["Pod"]
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
                - argocd
                - local-path-storage
      validate:
        message: "Containers must drop the ALL capability set."
        pattern:
          spec:
            containers:
              - securityContext:
                  capabilities:
                    drop: ["ALL"]
